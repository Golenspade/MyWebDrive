name: Core release CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  core-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.6-alpine3.21
        env:
          POSTGRES_DB: mywebdrive_core_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mywebdrive_core_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.2-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CORE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mywebdrive_core_test?schema=public
      CORE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mywebdrive_core_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379/0
      CORE_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      STORAGE_TEST_REDIS_URL: redis://127.0.0.1:6379/1
      POSTGRES_PASSWORD: contract-test-password
      REDIS_PASSWORD: contract-test-password
      MINIO_ROOT_USER: contract-test-user
      MINIO_ROOT_PASSWORD: contract-test-password
      CORE_SESSION_SECRET: contract-core-session-secret-0000000000000001
      OTP_PEPPER: contract-otp-pepper-secret-000000000000000001
      STORAGE_GRANT_SECRET: contract-storage-grant-secret-00000000000001
      CORE_CALLBACK_SECRET: contract-core-callback-secret-0000000000001
      EMAIL_PROVIDER_URL: http://email-provider:8090
      EMAIL_PROVIDER_TOKEN: contract-email-provider-token-0000000001
      REGISTRY: registry.invalid
      IMAGE_TAG: ci-contract

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.3

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.7.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Core migrations
        run: pnpm --filter core-api exec prisma migrate deploy

      - name: Build workspace
        run: pnpm run build:all

      - name: Build six immutable application images
        run: |
          source_label=org.opencontainers.image.source=https://github.com/Golenspade/MyWebDrive
          docker build --label "$source_label" --file services/core-api/Dockerfile --tag mywebdrive-core-api:ci .
          docker build --label "$source_label" --file services/email-provider/Dockerfile --tag mywebdrive-email-provider:ci .
          docker build --label "$source_label" --file services/storage/Dockerfile --tag mywebdrive-storage:ci .
          docker build --label "$source_label" --file frontend/cruip-landing/Dockerfile --tag mywebdrive-web:ci .
          docker build --label "$source_label" --provenance=false --file infrastructure/alicloud/nginx/Dockerfile --tag mywebdrive-nginx:ci infrastructure/alicloud/nginx
          docker build --label "$source_label" --file infrastructure/alicloud/prometheus/Dockerfile --tag mywebdrive-prometheus:ci infrastructure/alicloud/prometheus

      - name: Smoke immutable runtime images
        run: |
          test "$(docker run --rm --entrypoint sh mywebdrive-core-api:ci -c 'id -u')" != "0"
          test "$(docker run --rm --entrypoint sh mywebdrive-email-provider:ci -c 'id -u')" != "0"
          test "$(docker run --rm --entrypoint sh mywebdrive-storage:ci -c 'id -u')" != "0"
          test "$(docker run --rm --entrypoint sh mywebdrive-web:ci -c 'id -u')" != "0"
          test "$(docker run --rm --entrypoint sh mywebdrive-nginx:ci -c 'id -u')" != "0"
          test "$(docker run --rm --entrypoint sh mywebdrive-prometheus:ci -c 'id -u')" != "0"
          docker run --rm --read-only --tmpfs /tmp --entrypoint sh mywebdrive-core-api:ci -c 'openssl version && ./node_modules/.bin/prisma --version'
          docker run --rm --read-only --tmpfs /tmp --entrypoint node mywebdrive-core-api:ci -e "import('@mywebdrive/observability').then(m => { if (typeof m.createAppTelemetry !== 'function') process.exit(1) })"
          docker run --rm --read-only --tmpfs /tmp --entrypoint node mywebdrive-email-provider:ci -e "import('./dist/app.js').then(() => process.stdout.write('email provider runtime ok\\n'))"
          docker run --rm --read-only --tmpfs /tmp --entrypoint node mywebdrive-email-provider:ci -e "import('./dist/directmail.js').then(m => { m.createDirectMailRuntime({ roleName: 'MyWebDriveDirectMailRole', endpoint: 'dm.aliyuncs.com', regionId: 'cn-hangzhou', disableImdsV1: true }); process.stdout.write('directmail SDK runtime ok\\n') })"
          docker run --rm --read-only --tmpfs /tmp --entrypoint node mywebdrive-storage:ci -e "import('./dist/runtime.js').then(() => process.stdout.write('storage runtime ok\\n'))"
          docker run --rm --read-only --tmpfs /tmp --entrypoint node mywebdrive-storage:ci -e "import('@mywebdrive/observability').then(m => { if (typeof m.createAppTelemetry !== 'function') process.exit(1) })"
          docker run --rm --read-only --tmpfs /tmp --entrypoint node mywebdrive-web:ci -e "process.stdout.write('web runtime ok\\n')"
          docker run --rm --read-only \
            --add-host storage-api:127.0.0.1 \
            --add-host core-api:127.0.0.1 \
            --add-host web:127.0.0.1 \
            --tmpfs /tmp:uid=101,gid=101,mode=1777 \
            --tmpfs /var/cache/nginx:uid=101,gid=101,mode=0755 \
            --tmpfs /var/run:uid=101,gid=101,mode=0755 \
            mywebdrive-nginx:ci nginx -t
          docker run --rm --read-only --tmpfs /prometheus --entrypoint /bin/promtool \
            mywebdrive-prometheus:ci check config /etc/prometheus/prometheus.yml

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Lint workspace
        run: pnpm run lint:all

      - name: Test Core, Storage and frontend
        run: |
          pnpm -C packages/observability test
          pnpm run test:all
          pnpm run verify:docs
          bash scripts/test-repo-authority-contract.sh
          bash scripts/test-core-dev-contract.sh

      - name: Enforce immutable release contract
        run: |
          bash scripts/verify-core-release-contract.sh infrastructure/alicloud/docker-compose.core.yml
          bash scripts/test-core-release-contract.sh
          bash scripts/test-core-cutover-contract.sh

      - name: Validate production compose
        run: docker compose -f infrastructure/alicloud/docker-compose.core.yml config -q

      - name: Publish immutable images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          release_tag=sha-${GITHUB_SHA}
          registry=ghcr.io/golenspade
          for name in core-api email-provider storage web nginx prometheus; do
            docker tag "mywebdrive-${name}:ci" "${registry}/mywebdrive-${name}:${release_tag}"
            docker push "${registry}/mywebdrive-${name}:${release_tag}"
          done
