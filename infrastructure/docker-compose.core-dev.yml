x-core-build: &core-build
  context: ../..
  dockerfile: services/core-api/Dockerfile

x-storage-build: &storage-build
  context: ../..
  dockerfile: services/storage/Dockerfile

services:
  core-migrate:
    image: mywebdrive-core-dev-core-api:local
    build: *core-build

  email-provider:
    image: mywebdrive-core-dev-fake-email:local
    build:
      context: ../..
      dockerfile: scripts/smoke/fake-email/Dockerfile
    environment:
      NODE_ENV: development
      EMAIL_PROVIDER_PORT: "8025"
      EMAIL_PROVIDER_TOKEN: ${EMAIL_PROVIDER_TOKEN:?EMAIL_PROVIDER_TOKEN is required}
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8025/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20

  core-api:
    image: mywebdrive-core-dev-core-api:local
    build: *core-build
    environment:
      NODE_ENV: development
      EMAIL_PROVIDER_URL: http://email-provider:8025
      EMAIL_PROVIDER_TOKEN: ${EMAIL_PROVIDER_TOKEN:?EMAIL_PROVIDER_TOKEN is required}
      GIT_SHA: local-dev
      BUILD_ID: local-dev

  analytics-worker:
    image: mywebdrive-core-dev-core-api:local
    build: *core-build
    environment:
      NODE_ENV: development
      GIT_SHA: local-dev
      BUILD_ID: local-dev

  storage-api:
    image: mywebdrive-core-dev-storage:local
    build: *storage-build
    environment:
      NODE_ENV: development

  storage-worker:
    image: mywebdrive-core-dev-storage:local
    build: *storage-build
    environment:
      NODE_ENV: development

  prometheus:
    image: mywebdrive-core-dev-prometheus:local
    build:
      context: prometheus
      dockerfile: Dockerfile

  web:
    image: mywebdrive-core-dev-web:local
    build:
      context: ../..
      dockerfile: frontend/cruip-landing/Dockerfile

  nginx:
    image: mywebdrive-core-dev-nginx:local
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports: !override
      - "127.0.0.1:8080:8080"
