global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: core-api
    static_configs:
      - targets:
          - 'core-api:8080'

  - job_name: storage-api
    static_configs:
      - targets:
          - 'storage-api:7084'

  - job_name: storage-worker
    static_configs:
      - targets:
          - 'storage-worker:7085'
