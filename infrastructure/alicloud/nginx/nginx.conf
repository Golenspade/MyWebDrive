worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format safe '$remote_addr $request_method $status $body_bytes_sent $request_time';
  access_log /dev/stdout safe;
  error_log /dev/stderr warn;
  server_tokens off;

  server {
    listen 8080;
    listen [::]:8080;

    location = /healthz {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok","service":"nginx"}\n';
    }

    location = /api/v1/internal {
      return 404;
    }

    location ^~ /api/v1/internal/ {
      return 404;
    }

    location ^~ /api/v1/storage/uploads/ {
      proxy_pass http://storage-api:7084;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/storage/objects/ {
      proxy_pass http://storage-api:7084;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/ {
      proxy_pass http://core-api:8080;
      proxy_http_version 1.1;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://web:4323;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
